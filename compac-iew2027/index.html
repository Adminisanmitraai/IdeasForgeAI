<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMPAC | India Energy Week 2027 — Concept Presentation</title>
<meta name="description" content="Management-ready exhibition stand concept presentation for COMPAC Industries India Ltd., IEW 2027, Stall 3B077A, 4 x 8 m.">
<style>
:root{--n:#102856;--b:#234d99;--g:#caa554;--white:#fff;--muted:#687790;--ice:#eff3f9;--line:#dce5f0;--deep:#07162d}
*{box-sizing:border-box}html,body{margin:0;background:#07152b;color:var(--n);height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
#app{width:min(100vw,177.7777vh);height:min(100vh,56.25vw);position:relative;overflow:hidden;background:#fff;box-shadow:0 0 70px #0108189e}
.screen{position:absolute;inset:0;padding:4.45% 5.25% 6.3%;overflow:hidden;background:#fff;animation:fade .38s ease}
@keyframes fade{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.screen.dark{background:linear-gradient(145deg,#06152f,#12366c 75%,#264c8b);color:white}
.eyebrow{font-size:clamp(8px,.97vw,16px);font-weight:800;letter-spacing:.18em;color:var(--g);margin-bottom:1.5%}
h1{font-size:clamp(26px,4.8vw,85px);line-height:1.04;letter-spacing:-.05em;margin:.1em 0 .24em;font-weight:800}
h2{font-size:clamp(21px,3.1vw,58px);line-height:1.1;letter-spacing:-.042em;margin:0 0 .28em;font-weight:790}
h3{font-size:clamp(11px,1.28vw,24px);margin:0 0 .55em}
.lead{font-size:clamp(10px,1.24vw,22px);color:var(--muted);line-height:1.5;margin:0;max-width:95%}.dark .lead{color:#cfdbed}
.mark{font-size:clamp(12px,1.4vw,25px);font-weight:900;letter-spacing:-.035em;color:var(--b)}
.dark .mark{color:white}.mark:before{content:"◜";color:var(--g);font-size:1.5em;vertical-align:-.05em;margin-right:.16em}
.top{position:absolute;z-index:8;top:2.5%;left:5.3%;right:5.3%;display:flex;justify-content:space-between;align-items:center}.top .sub{font-size:clamp(8px,.75vw,14px);letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--muted)}.dark .top .sub{color:#dae5f3}
.goldbar{height:.65%;position:absolute;top:0;left:0;right:0;background:var(--g)}
.bottom{position:absolute;left:5.3%;right:5.3%;bottom:3.45%;display:flex;justify-content:space-between;align-items:center;font-size:clamp(8px,.74vw,15px);font-weight:600;color:#75849f}.dark .bottom{color:#b3c6e6}
.caps{color:var(--g);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(9px,1.03vw,18px)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.35%;margin-top:4.0%}.card{background:var(--ice);border:1px solid #dfe5ef;border-radius:1.05vw;padding:5.3% 6%;min-height:13vw}.card h3{font-size:clamp(11px,1.3vw,24px);color:var(--b);margin-bottom:.55em}.card p{font-size:clamp(9px,1.0vw,19px);line-height:1.4;margin:0;color:#43546e}.stat{font-size:clamp(26px,3.2vw,64px);font-weight:800;color:var(--g);line-height:1;margin-bottom:.26em}
.cols{display:grid;grid-template-columns:1.05fr .95fr;gap:4.2%;height:75%;align-items:center;margin-top:2%}
.scene{width:100%;aspect-ratio:16/9;border-radius:1.25vw;overflow:hidden;box-shadow:0 2vw 4vw #05132942;background:#112649}
.scene svg{width:100%;height:100%;display:block}
.plan-frame{background:#f8fafd;border:1px solid #e1e8f1;border-radius:1vw;padding:2.5%;height:95%;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:4%}.plan-frame svg{max-width:100%;height:100%}
.detail-list{display:flex;flex-direction:column;gap:1.0vw;margin-top:1.7vw}.feature{display:flex;align-items:start;gap:.65vw;line-height:1.4;font-size:clamp(10px,1.05vw,20px);font-weight:500}.feature .tick{flex:0 0 1.1vw;width:1.1vw;height:1.1vw;border-radius:100%;background:var(--g);margin-top:.16vw}
.number{font-size:clamp(13px,1.1vw,22px);color:var(--g);font-weight:900;letter-spacing:.1em}
.ribbon{display:inline-flex;align-items:center;gap:.65vw;color:var(--g);font-size:clamp(9px,.95vw,17px);font-weight:800;text-transform:uppercase;letter-spacing:.15em}
.hero{display:grid;grid-template-columns:1fr .92fr;align-items:center;gap:2vw;height:90%}.hero h1{font-size:clamp(29px,4.55vw,84px)}.hero .scene{transform:perspective(1000px) rotateY(-7deg);border:1px solid #7b94bc}
.meta{display:flex;gap:1.5vw;flex-wrap:wrap;margin-top:2.2vw}.pill{padding:.62vw 1.1vw;background:#ffffff13;border:1px solid #ffffff55;border-radius:2vw;font-weight:700;font-size:clamp(9px,1vw,17px)}
.aside{padding:2.2vw;background:var(--ice);border-radius:1.1vw}.aside strong{color:var(--b)}
.micro{font-size:clamp(9px,.84vw,17px);color:#6b7891;line-height:1.45}
.comp{width:100%;border-collapse:separate;border-spacing:.3vw;margin-top:3vw;font-size:clamp(9px,1.03vw,18px)}.comp th{text-align:left;background:var(--n);color:white;padding:1.2vw 1vw;border-radius:.25vw}.comp td{background:#eef2f8;padding:1.05vw 1vw;color:#233b64}.comp tr:nth-child(odd) td{background:#f8faff}.comp td:first-child{font-weight:750;color:var(--n)}
.highlight{background:#fff5dc;padding:1vw 1.4vw;border-radius:.55vw;color:var(--n);font-weight:800;font-size:clamp(10px,1.15vw,21px);margin-top:1.2vw}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw;margin-top:4vw}.flow .step{padding:1.5vw;background:#edf2fa;border-radius:.75vw;min-height:12vw}.flow .step strong{color:var(--b);display:block;font-size:clamp(11px,1.15vw,21px);margin:.7vw 0}.flow .step p{font-size:clamp(9px,1.0vw,19px);line-height:1.45;color:#53637c}
.locationgrid{display:grid;grid-template-columns:1fr 1fr;gap:4vw;align-items:center;margin-top:2vw}.locationgrid .plan-frame{height:24vw;max-height:55vh}
.locationfacts{display:grid;grid-template-columns:1fr 1fr;gap:1.1vw}.locationfacts>div{background:var(--ice);padding:1.5vw;border-radius:.65vw}.locationfacts b{display:block;font-size:clamp(20px,2.6vw,48px);color:var(--b)}.locationfacts small{color:#65738b;font-size:clamp(9px,.95vw,18px)}
#controls{position:absolute;bottom:0;left:0;right:0;height:3.1%;display:flex;align-items:stretch;background:var(--n);z-index:30}#progress{background:var(--g);height:100%;width:8.3%;transition:width .3s}#toolbar{position:fixed;left:50%;bottom:1.4vh;transform:translateX(-50%);display:flex;gap:9px;align-items:center;background:#071b3eea;border:1px solid #ffffff2e;border-radius:60px;padding:7px 10px;z-index:100;box-shadow:0 8px 32px #020a1d99;color:white;backdrop-filter:blur(15px)}
button{appearance:none;border:0;background:#ffffff15;color:white;border-radius:50px;min-width:36px;height:36px;cursor:pointer;font-size:17px;padding:0 11px}button:hover{background:#ffffff30}button:focus-visible{outline:2px solid var(--g)}#count{font-size:12px;font-weight:750;min-width:57px;text-align:center}#fullscreen{font-size:14px}
.kbd{font-size:11px;color:#aabbce;margin:0 6px}
@media(max-width:760px){.screen{padding:5% 5.5% 7%}.card p{font-size:9px}.cards{gap:1%}.card{border-radius:7px;padding:9%;min-height:20vw}.cols{gap:2.3%}.plan-frame{border-radius:6px}.aside{padding:10px}.flow .step{padding:8px}.feature{font-size:9px}.feature .tick{flex-basis:7px;width:7px;height:7px}.mark{font-size:11px}#toolbar{bottom:10px}.kbd{display:none}}
</style></head><body>
<div id="app"><div class="goldbar"></div><div id="stage"></div><div id="controls"><div id="progress"></div></div></div>
<div id="toolbar"><button id="prev" aria-label="Previous slide">‹</button><span id="count">01 / 11</span><button id="next" aria-label="Next slide">›</button><button id="fullscreen" title="Fullscreen presentation">⛶</button><span class="kbd">← → SPACE</span></div>
<script>
const titles=['Vision','Project brief','Site geometry','Concept 01','Concept 01 plan','Concept 02','Concept 02 plan','Concept 03','Concept 03 plan','Comparison','Next steps'];
let index=0;
function shell(body,{dark=false,label='CONCEPT PRESENTATION'}={}){return '<div class="screen'+(dark?' dark':'')+'"><div class="top"><div class="mark">COMPAC <span style="font-size:.48em;font-weight:600;letter-spacing:.02em">INDUSTRIES INDIA LTD.</span></div><div class="sub">IEW 2027 · 3B077A</div></div>'+body+'<div class="bottom"><span>'+label+' · MANAGEMENT REVIEW</span><span>CONCEPT / SUBJECT TO FINAL CAD</span></div></div>';}
function features(items){return '<div class="detail-list">'+items.map(x=>'<div class="feature"><i class="tick"></i><div>'+x+'</div></div>').join('')+'</div>'}
function scene(v=0){
 const roof=v===1?'#21428c':v===2?'#122753':'#1e438e';
 let units='';
 for(let i=0;i<3;i++){let x=430+i*105,y=240-(i===2?3:0);units+='<g transform="translate('+x+','+y+')"><rect width="62" height="159" x="0" y="0" rx="5" fill="#f5f7fa" stroke="#bdcbe1" stroke-width="2"/><rect x="7" y="24" width="48" height="38" rx="3" fill="#193b84"/><rect x="12" y="32" width="38" height="21" fill="#5584c7"/><rect x="11" y="87" width="40" height="3" fill="#caa554"/><rect x="13" y="104" width="36" height="30" fill="#173b83"/><text x="31" y="123" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="800">COMPAC</text><path d="M58 70 C83 69 76 114 71 137" fill="none" stroke="#141f3e" stroke-width="6" stroke-linecap="round"/><circle cx="73" cy="139" r="5" fill="#d2ad58"/></g>'}
 return '<svg viewBox="0 0 900 505" xmlns="http://www.w3.org/2000/svg" aria-label="Conceptual COMPAC exhibition booth visualization"><defs><linearGradient id="bg'+v+'" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182844"/><stop offset="1" stop-color="#55729c"/></linearGradient><linearGradient id="fl'+v+'" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f6fa"/><stop offset="1" stop-color="#b9c4d7"/></linearGradient></defs><rect width="900" height="505" fill="url(#bg'+v+')"/><g stroke="#b6c4d7" stroke-opacity=".18">'+Array.from({length:12},(_,i)=>'<path d="M0 '+(40*i)+' H900" />').join('')+'</g><polygon points="130,400 760,400 875,479 245,479" fill="url(#fl'+v+')" stroke="#bc9a50" stroke-width="5"/><rect x="145" y="156" width="625" height="245" fill="#f6f8fa"/><rect x="157" y="210" width="245" height="182" fill="#122a58"/><rect x="165" y="218" width="229" height="164" fill="#ecf0f6"/><rect x="188" y="294" width="176" height="63" rx="11" fill="#d1d8e5"/><rect x="184" y="309" width="30" height="56" rx="7" fill="#b5c3d8"/><rect x="336" y="309" width="30" height="56" rx="7" fill="#b5c3d8"/><rect x="213" y="262" width="120" height="38" fill="#fefefe"/><rect x="172" y="218" width="223" height="3" fill="#caa554"/><rect x="175" y="233" width="94" height="24" fill="#19488d"/><text x="222" y="250" text-anchor="middle" font-size="12" font-family="Arial" font-weight="700" fill="white">VIP LOUNGE</text><rect x="405" y="210" width="355" height="178" fill="#dce7f4"/><rect x="414" y="216" width="340" height="164" fill="#183b7c"/><path d="M419 340 Q550 240 748 328" fill="none" stroke="#2b65ae" stroke-width="16" opacity=".3"/><path d="M135 104 L782 104 L840 152 L194 152 Z" fill="'+roof+'"/><rect x="135" y="104" width="646" height="65" rx="3" fill="white"/><rect x="135" y="163" width="646" height="7" fill="#caa554"/><path d="M782 104 L838 152 V205 L782 169 Z" fill="#16336a"/><text x="160" y="147" font-family="Arial" font-size="35" fill="#17418c" font-weight="800">◜ COMPAC</text><text x="424" y="143" font-family="Arial" font-size="16" fill="#31518b" font-weight="700">FUEL DISPENSING TECHNOLOGY</text><rect x="182" y="170" width="18" height="220" fill="#173b7d"/><rect x="757" y="170" width="18" height="220" fill="#173b7d"/>'+units+'<path d="M178 356 L325 356 L365 386 L211 386 Z" fill="#e9eff8"/><path d="M175 356 H322 V416 H175 Z" fill="#fff" stroke="#becbdc"/><path d="M175 408 H322" stroke="#caa554" stroke-width="5"/><text x="202" y="391" font-size="21" font-family="Arial" font-weight="800" fill="#214689">COMPAC</text><rect x="782" y="206" width="49" height="155" rx="3" fill="#203e7b"/><text x="807" y="235" text-anchor="middle" fill="#d7b65b" font-size="10" font-family="Arial">DEMO</text><rect x="793" y="251" width="27" height="80" fill="#3b6ca7"/><text x="470" y="434" fill="#173b7c" font-size="12" font-family="Arial" font-weight="700">Illustrative visualisation — confirm dimensions in CAD</text></svg>'}
function plan(v=0,small=false){
 const r=v===0?[1.54,.25,2.22,2.45]:v===1?[1.62,.23,2.14,2.48]:[1.45,.22,2.3,3.03];
 let disp=v===1?[.8,2.65,4.55]:v===2?[1,3.55,5.67]:[1.05,3.08,5.08];
 const room=(x,y,w,h,label,color='#dbe5f4')=>'<rect x="'+(55+x*45)+'" y="'+(25+y*45)+'" width="'+(w*45)+'" height="'+(h*45)+'" rx="8" fill="'+color+'" stroke="#c4cedc"/><text x="'+(55+(x+w/2)*45)+'" y="'+(26+(y+h/2)*45)+'" font-family="Arial" font-weight="700" font-size="12" text-anchor="middle" fill="#1d4590">'+label+'</text>';
 let shape=room(...r,v===2?'VIP LOUNGE':'LOUNGE');
 shape+=room(v===2?2.6:2.38,v===2?3.45:2.91,v===2?1.1:1.42,.7,'COFFEE','#f6ecd4');
 shape+=room(v===1?2.2:.25,v===1?6.68:6.62,v===1?1.55:1.55,.73,'RECEPTION');
 shape+=room(2.18,5.62,1.51,.7,'FRONT TV');
 for(let i=0;i<3;i++)shape+=room(.2,disp[i],.84,.55,'D'+(i+1),'#e7bb56');
 return '<svg viewBox="0 0 320 425" aria-label="Four metre wide by eight metre deep corner booth floor plan" xmlns="http://www.w3.org/2000/svg"><rect x="55" y="25" width="180" height="360" fill="#f9fbff"/><path d="M55 25 H235 V385" fill="none" stroke="#1b468f" stroke-width="6"/><path d="M55 25 V385 H235" fill="none" stroke="#d3a951" stroke-width="5"/><path d="M55 25 V385 H235" fill="none" stroke="#fbf9ef" stroke-width="1" stroke-dasharray="8 7"/>'+shape+'<text x="20" y="197" text-anchor="middle" transform="rotate(-90 20 197)" fill="#1b468f" font-weight="800" font-size="16" font-family="Arial">OPEN AISLE · 8 m</text><text x="145" y="412" text-anchor="middle" fill="#1b468f" font-weight="800" font-size="14" font-family="Arial">OPEN AISLE · 4 m</text></svg>'}
const drafts=[
()=>shell('<div class="hero"><div><div class="ribbon">INDIA ENERGY WEEK 2027 · HALL 3</div><h1>Engineering the<br><span style="color:#d1ad5f">Future of<br>Fueling.</span></h1><p class="lead">COMPAC Industries India Ltd.<br>Three exhibition concepts designed around the visitor, the product and the conversation.</p><div class="meta"><span class="pill">3B077A</span><span class="pill">4 × 8 m · 32 m²</span><span class="pill">2-side open corner</span></div></div><div class="scene">'+scene(0)+'</div></div>',{dark:true,label:'DESIGN PROPOSAL / 20 NOV 2026'}),
()=>shell('<div class="eyebrow">01 / THE ASSIGNMENT</div><h2>Every square metre<br>must work harder.</h2><p class="lead">Management brief received from COMPAC on 20 November 2026.</p><div class="cards">'+[['03','Dispensers','840 W × 450 D × 1650 H mm each'],['01','Guest waiting room','Sofa, TV, keyed locker, enclosed privacy'],['02','Displays','Front demonstration TV plus lounge TV'],['01','Reception','Counter with provision for 1–2 hostesses'],['01','Hospitality zone','Coffee machine, cups and concealed storage'],['100%','Brand-ready','Fascia, graphics, carpet, cable routing and power']].map(([a,b,c])=>'<div class="card"><div class="stat">'+a+'</div><h3>'+b+'</h3><p>'+c+'</p></div>').join('')+'</div>',{label:'CLIENT REQUIREMENTS / SOURCE: COMPAC EMAIL'}),
()=>shell('<div class="eyebrow">02 / VERIFIED SITE</div><h2>A corner footprint.<br>A long runway for products.</h2><div class="locationgrid"><div class="plan-frame" style="display:flex;justify-content:center">'+plan(0)+'</div><div><div class="locationfacts"><div><b>8 m</b><small>Long open aisle frontage</small></div><div><b>4 m</b><small>Short open aisle frontage</small></div><div><b>32 m²</b><small>Confirmed floor area</small></div><div><b>2</b><small>Shared closed boundaries</small></div></div><p class="micro" style="margin-top:1.4vw">Official floor-plan orientation: open left and bottom edges, closed right and top. Adjacent plot on the right: 3B077B. Final fabrication drawings must retain this footprint.</p></div></div>',{label:'OFFICIAL IEW SITE / 3B077A'}),
()=>shell('<div class="eyebrow">03 / DESIGN DIRECTION 01</div><h2>Open Product Gallery</h2><p class="lead">The cleanest expression of COMPAC: visible product technology, strong brand presence, frictionless visitor flow.</p><div class="cols"><div class="scene">'+scene(0)+'</div><div class="aside"><div class="caps">Product-led thinking</div>'+features(['Three units presented along the 8 m aisle edge','Corner reception welcomes visitors from both aisles','Lounge remains quiet at the rear / right','Premium blue–gold identity with clear digital storytelling'])+'</div></div>',{label:'OPTION 01 / CONCEPT VISUAL'}),
()=>shell('<div class="eyebrow">04 / PLAN STUDY 01</div><h2>Open Product Gallery · Top View</h2><div class="cols"><div class="plan-frame">'+plan(0)+'<div><h3>Most balanced arrangement</h3>'+features(['Long-side dispenser gallery','Rear VIP waiting room','TV and coffee counter','Corner reception'])+'</div></div><div><div class="number">RECOMMENDED STARTING POINT</div><h3 style="font-size:2.1vw;margin-top:.8vw">Maximum product visibility. Minimal friction.</h3><p class="lead">A practical starting layout for management approval. The central walking lane connects the 4 m open side with the 8 m aisle, while preserving a separate client waiting room.</p><p class="micro" style="margin-top:1.4vw">Schematic plan; final CAD shall verify clearances, door swing, seating and electrical points.</p></div></div>',{label:'OPTION 01 / TOP VIEW / NOT CAD'}),
()=>shell('<div class="eyebrow">05 / DESIGN DIRECTION 02</div><h2>Technology Gallery</h2><p class="lead">Digital-led storytelling and a more dynamic arrival sequence for product demonstrations.</p><div class="cols"><div class="scene">'+scene(1)+'</div><div class="aside"><div class="caps">Digital-led experience</div>'+features(['An eye-catching front display for company films','Three dispensers aligned with the flow of visitors','Branded technology graphics and metering stories','Distinct hospitality and executive lounge'])+'</div></div>',{label:'OPTION 02 / CONCEPT VISUAL'}),
()=>shell('<div class="eyebrow">06 / PLAN STUDY 02</div><h2>Technology Gallery · Top View</h2><div class="cols"><div class="plan-frame">'+plan(1)+'<div><h3>Engagement-led</h3>'+features(['Frontward digital activation','Dispenser viewing sequence','Reception toward short entrance','Rear meeting lounge'])+'</div></div><div><div class="number">BEST FOR IMMERSIVE STORYTELLING</div><h3 style="font-size:2vw;margin-top:.8vw">A booth that speaks before staff do.</h3><p class="lead">The long edge establishes a highly visible innovation zone while the second open edge offers a decisive point of entry.</p><p class="micro" style="margin-top:1.3vw">The 55-inch screen size shown in some illustrations is not yet approved; confirm final AV specifications.</p></div></div>',{label:'OPTION 02 / TOP VIEW / NOT CAD'}),
()=>shell('<div class="eyebrow">07 / DESIGN DIRECTION 03</div><h2>Executive Connect</h2><p class="lead">A warm, architecture-led concept that elevates comfort and high-quality business discussion.</p><div class="cols"><div class="scene">'+scene(2)+'</div><div class="aside"><div class="caps">Hospitality-led strategy</div>'+features(['A more comfortable enclosed VIP waiting room','Sofa and digital display in a quiet environment','Three dispensers retain long-aisle visibility','Wood-texture accents and discreet lighting'])+'</div></div>',{label:'OPTION 03 / CONCEPT VISUAL'}),
()=>shell('<div class="eyebrow">08 / PLAN STUDY 03</div><h2>Executive Connect · Top View</h2><div class="cols"><div class="plan-frame">'+plan(2)+'<div><h3>Meeting-led</h3>'+features(['Expanded lounge footprint','Concealed locker and coffee zone','Staggered long-side product display','Compact front reception'])+'</div></div><div><div class="number">BEST FOR PRIVATE BUSINESS DISCUSSIONS</div><h3 style="font-size:2vw;margin-top:.8vw">Less noise. Better conversations.</h3><p class="lead">Higher lounge emphasis and hospitality, while preserving a visible outdoor product display zone.</p><p class="micro" style="margin-top:1.3vw">Seating and three-product clearances require detailed verification before selecting this direction.</p></div></div>',{label:'OPTION 03 / TOP VIEW / NOT CAD'}),
()=>shell('<div class="eyebrow">09 / SIDE-BY-SIDE REVIEW</div><h2>Choose the right balance.</h2><table class="comp"><tr><th>DESIGN CRITERIA</th><th>01 · OPEN GALLERY</th><th>02 · TECHNOLOGY</th><th>03 · EXECUTIVE</th></tr>'+[['Product visibility','Excellent','Excellent','Good'],['Meeting privacy','Good','Good','Excellent'],['Digital demonstration','Good','Excellent','Good'],['Visitor circulation','Excellent','Good','Good'],['Visual identity','Open, product-led','Tech-forward','Premium, warm']].map(a=>'<tr>'+a.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table><div class="highlight">RECOMMENDATION — Develop Option 01 in CAD; incorporate the digital storytelling features of Option 02.</div>',{label:'QUALITATIVE CONCEPT COMPARISON / NO BOQ INCLUDED'}),
()=>shell('<div class="eyebrow">10 / DESIGN DELIVERY</div><h2>From creative concept<br>to production-ready booth.</h2><div class="flow">'+[['01','Shortlist','Select the direction and identify must-retain elements.'],['02','Technical inputs','Confirm final product drawings, power, booth rules and brand files.'],['03','Detailed design','Create CAD plan, elevations, exact renders, AV and electrical layout.'],['04','Cost & approve','Prepare BOQ and fabrication timeline for management sign-off.']].map(a=>'<div class="step"><div class="number">'+a[0]+'</div><strong>'+a[1]+'</strong><p>'+a[2]+'</p></div>').join('')+'</div><p class="lead" style="margin-top:2vw">Design note: the visuals are concept studies, not final fabrication drawings. The official COMPAC vector logo, material finishes, engineering and demonstration safety are to be confirmed.</p>',{label:'NEXT STEP / MANAGEMENT SHORTLIST'})
];
function draw(i){index=(i+drafts.length)%drafts.length;document.getElementById('stage').innerHTML=drafts[index]();document.getElementById('count').textContent=String(index+1).padStart(2,'0')+' / '+drafts.length;document.getElementById('progress').style.width=(100*(index+1)/drafts.length)+'%';document.title=titles[index]+' | COMPAC IEW 2027';history.replaceState(null,'','#slide-'+(index+1));}
document.getElementById('prev').onclick=()=>draw(index-1);
document.getElementById('next').onclick=()=>draw(index+1);
document.getElementById('fullscreen').onclick=()=>{const el=document.getElementById('app');if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen();};
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();draw(index+1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();draw(index-1)}else if(e.key.toLowerCase()==='f'){document.getElementById('fullscreen').click()}});
let touchX=0;document.getElementById('app').addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});
document.getElementById('app').addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>40)draw(index+(d<0?1:-1))},{passive:true});
let fromHash=Number(location.hash.replace('#slide-',''))-1;draw(Number.isInteger(fromHash)&&fromHash>=0?fromHash:0);
</script></body></html>
