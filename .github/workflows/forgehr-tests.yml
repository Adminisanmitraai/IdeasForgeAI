name: ForgeHR assistant tests

on:
  pull_request:
    paths:
      - 'backend/forgehr_assistant_api.py'
      - 'backend/tests/test_forgehr_*.py'
      - 'backend/tests/requirements-forgehr.txt'
      - '.github/workflows/forgehr-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/forgehr_assistant_api.py'
      - 'backend/tests/test_forgehr_*.py'
      - 'backend/tests/requirements-forgehr.txt'
      - '.github/workflows/forgehr-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forgehr-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/tests/requirements-forgehr.txt
      - name: Install focused test dependencies
        run: python -m pip install -r backend/tests/requirements-forgehr.txt
      - name: Run all ForgeHR assistant tests
        run: python -m unittest discover -s backend/tests -p 'test_forgehr_*.py' -v
      - name: Verify direct execution includes project tests
        run: python backend/tests/test_forgehr_assistant_api.py ProjectContextTests -v
