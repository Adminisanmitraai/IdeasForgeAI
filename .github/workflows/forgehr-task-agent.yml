name: ForgeHR Demo task agent
on:
  pull_request:
    paths: ['backend/forgehr_task_agent.py', 'backend/forgehr_demo_guide.py', 'backend/tests/test_forgehr_demo_guide.py', 'backend/forgehr_assistant_api.py', 'backend/tests/test_forgehr_task_agent.py', '.github/workflows/forgehr-task-agent.yml']
  push:
    branches: [main]
    paths: ['backend/forgehr_task_agent.py', 'backend/forgehr_demo_guide.py', 'backend/tests/test_forgehr_demo_guide.py', 'backend/forgehr_assistant_api.py', 'backend/tests/test_forgehr_task_agent.py', '.github/workflows/forgehr-task-agent.yml']
permissions:
  contents: read
jobs:
  demo-agent-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi==0.150.0 starlette==1.9.0 pydantic==2.14.0 httpx==0.28.1
      - run: python -m unittest discover -s backend/tests -p 'test_forgehr_*.py' -v
        env:
          PYTHONPATH: .
